<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Contato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">FoodExpress</a>

            <div>

                <a href="/" class="btn btn-warning">Home</a>

                <a href="/cardapio" class="btn btn-primary">
                    Cardápio
                </a>

                <a href="/pedidos" class="btn btn-success">
                    Pedidos
                </a>

                <a href="/cliente/Ana/Natal" class="btn btn-info">
                    Cliente
                </a>

            </div>

        </div>

    </nav>

    <div class="container mt-5">

        <h1>Contato</h1>

        <form>

            <div class="mb-3">

                <label class="form-label">
                    Nome
                </label>

                <input type="text" class="form-control" placeholder="Digite seu nome">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email" class="form-control" placeholder="Digite seu email">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Mensagem
                </label>

                <textarea class="form-control" rows="5" placeholder="Digite sua mensagem"></textarea>

            </div>

            <button class="btn btn-primary">

                Enviar

            </button>

        </form>

        <hr>

        <h5>Informações</h5>

        <p>FoodExpress Delivery</p>

        <p>Email: contato@foodexpress.com</p>

        <p>Telefone: (84) 99999-9999</p>

        <a href="/" class="btn btn-dark">

            Voltar ao início

        </a>

    </div>

</body>

</html>
