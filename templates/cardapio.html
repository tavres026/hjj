<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Cardápio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">FoodExpress</a>

            <div>

                <a href="/" class="btn btn-warning">Home</a>

                <a href="/pedidos" class="btn btn-success">Pedidos</a>

                <a href="/contato" class="btn btn-danger">Contato</a>

            </div>

        </div>

    </nav>

    <div class="container mt-5">

        <h1 class="mb-4">Cardápio</h1>

        <div class="row">

            <div class="col-md-3">

                <div class="card">

                    <img src="{{ url_for('static', filename='hamburge.jpg') }}" class="card-img-top">

                    <div class="card-body">

                        <h5>X-Burguer</h5>

                        <p>Hambúrguer artesanal.</p>

                        <p>R$30</p>

                        <a href="/lanche/hamburguer" class="btn btn-primary">

                            Comprar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card">

                    <img src="{{ url_for('static', filename='pizza.jpg') }}" class="card-img-top">

                    <div class="card-body">

                        <h5>Pizza</h5>

                        <p>Pizza especial.</p>

                        <p>R$45</p>

                        <a href="/lanche/pizza" class="btn btn-primary">

                            Comprar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card">

                    <img src="{{ url_for('static', filename='batata.jpg') }}" class="card-img-top">

                    <div class="card-body">

                        <h5>Batata Frita</h5>

                        <p>Batata crocante.</p>

                        <p>R$15</p>

                        <a href="/lanche/batata" class="btn btn-primary">

                            Comprar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card">

                    <div class="card-body">

                        <h5>Milkshake</h5>

                        <p>Chocolate cremoso.</p>

                        <p>R$20</p>

                        <a href="milkshake" class="btn btn-primary">

                            Comprar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
