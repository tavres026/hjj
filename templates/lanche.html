<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Lanche</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">FoodExpress</a>

            <div>

                <a href="/cardapio" class="btn btn-primary">
                    Cardápio
                </a>

                </a>

            </div>

    </nav>

    <div class="container mt-5">

        <h1>

            Lanche escolhido: {{ nome }}

        <a href="/cardapio" class="btn btn-dark">

            Voltar ao Cardápio

        </a>

    </div>

</html>
